name: Report validation
on:
  pull_request:
    paths: ['reports/**', 'src/assets/reports/**', '.github/workflows/reports.yml']
permissions:
  contents: read
jobs:
  report:
    name: Validate report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
